<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>抽奖转盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2334c759'/%3E%3Ccircle cx='50' cy='50' r='18' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />

</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon-btn ghost" id="soundBtn" title="音效开关" aria-label="音效开关">
      <svg id="icoSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
      <svg id="icoSoundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
        <path d="m16.5 9.5 4 5M20.5 9.5l-4 5"/>
      </svg>
    </button>
    <div class="title">抽奖转盘</div>
    <button class="icon-btn" id="topEditBtn" title="奖品与权重" aria-label="奖品与权重">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M9 6h12M9 12h12M9 18h12"/>
        <circle cx="3.6" cy="6" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="3.6" cy="12" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="3.6" cy="18" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>

  <div class="wheel-area">
    <div class="wheel-wrap" id="wheelWrap">
      <canvas id="wheel"></canvas>
    </div>
  </div>

  <div class="result-line" id="resultLine">点击下方按钮开始抽奖</div>
  <button class="spin-btn" id="spinBtn">点击旋转</button>

  <button class="fab" id="fabEdit" title="添加 / 编辑奖品与权重" aria-label="添加或编辑奖品">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </button>
</div>

<!-- 设置面板 -->
<div class="sheet" id="sheet">
  <div class="backdrop" data-close="1"></div>
  <div class="panel">
    <div class="panel-head">
      <div style="flex:1">
        <h2>奖品与权重</h2>
        <div class="panel-sub">权重越大越容易中奖，可随时增删</div>
      </div>
      <button class="icon-btn" id="closeSheet" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="panel-body">
      <div id="itemList"></div>
      <button class="add-btn" id="addBtn" type="button">＋ 添加奖品</button>

      <div class="sect"><span>最近结果</span><button class="link-btn" id="clearHistory" type="button">清空</button></div>
      <div class="history" id="historyList"></div>

      <div class="hint">
        小提示：权重可以填小数（如 0.5）。每行右侧百分比为该奖品当前的中奖概率，合计 100%。
      </div>
    </div>
    <div class="panel-foot">
      <div class="foot-row">
        <button class="btn" id="resetBtn" type="button">恢复默认</button>
        <button class="btn" id="exportBtn" type="button">导出配置</button>
        <button class="btn" id="importBtn" type="button">导入配置</button>
      </div>
      <button class="btn primary foot-main" id="doneBtn" type="button">完成</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none" />
    </div>
  </div>
</div>

<!-- 中奖弹窗 -->
<div class="modal" id="winModal">
  <div class="backdrop" data-close="1"></div>
  <div class="win-card">
    <div class="win-label">恭 喜 中 奖</div>
    <div class="win-name" id="winName">—</div>
    <div class="win-sub" id="winSub">本轮抽奖结果</div>
    <div class="win-btns">
      <button class="btn" id="winClose" type="button">关闭</button>
      <button class="btn primary" id="winAgain" type="button">再来一次</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
